name: ms-laravel-rabbitmq-p5

services:
  admin_db:
    image: mysql:26.10@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    container_name: admin_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ADMIN_DB_DATABASE}
      MYSQL_USER: ${ADMIN_DB_USERNAME}
      MYSQL_PASSWORD: ${ADMIN_DB_PASSWORD}
    volumes:
      - admin_db_data:/var/lib/mysql
    ports:
      - "33063:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  main_db:
    image: mysql:26.10@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    container_name: main_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MAIN_DB_DATABASE}
      MYSQL_USER: ${MAIN_DB_USERNAME}
      MYSQL_PASSWORD: ${MAIN_DB_PASSWORD}
    volumes:
      - main_db_data:/var/lib/mysql
    ports:
      - "33064:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine@sha256:6cb708876a6163c93f1e5af03a649db13765027ff7a7d775c01a63b6a80545ee
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Runtime services - built from the Dockerfile's `runtime` target (the
  # default/last stage, so no explicit `target:` needed here). No source
  # bind mount: what runs is exactly the image that `make verify` already
  # built and tested, not a live host checkout re-installed at container
  # start. (Phase <5 of this program previously ran these dev-mode, with
  # `./admin:/var/www` shadowing the image's own vendor/ and a dev
  # entrypoint re-running `composer install` on every fresh container -
  # see admin/docker/docker-php-entrypoint-dev, kept but no longer wired
  # in here; flagged for Phase 7 as dead code once this baseline is
  # accepted.)
  # ---------------------------------------------------------------------
  admin_app:
    container_name: admin_app
    build: ./admin
    depends_on:
      admin_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: ${ADMIN_APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: admin_db
      DB_PORT: 3306
      DB_DATABASE: ${ADMIN_DB_DATABASE}
      DB_USERNAME: ${ADMIN_DB_USERNAME}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /
    restart: unless-stopped
    ports:
      - "8000:8080"

  main_app:
    container_name: main_app
    build: ./main
    depends_on:
      main_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: ${MAIN_APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: main_db
      DB_PORT: 3306
      DB_DATABASE: ${MAIN_DB_DATABASE}
      DB_USERNAME: ${MAIN_DB_USERNAME}
      DB_PASSWORD: ${MAIN_DB_PASSWORD}
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /
    restart: unless-stopped
    ports:
      - "8001:8080"

  main_worker:
    container_name: main_worker
    build: ./main
    depends_on:
      main_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=default", "--tries=3", "--sleep=3"]
    # The image's own HEALTHCHECK probes nginx on :8080, which this
    # service never starts (it only runs the artisan queue worker, via
    # the `command:` override above) - replaced with a process check.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    environment:
      APP_ENV: local
      APP_KEY: ${MAIN_APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: main_db
      DB_PORT: 3306
      DB_DATABASE: ${MAIN_DB_DATABASE}
      DB_USERNAME: ${MAIN_DB_USERNAME}
      DB_PASSWORD: ${MAIN_DB_PASSWORD}
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Test services - the Docker standard's `test` stage, run via
  # `make test` (`docker compose run --rm admin_test` / `main_test`)
  # against these same live db/rabbitmq containers. Never started by
  # `make up`/`docker compose up`; `profiles` keeps them out of the
  # default service set entirely.
  # ---------------------------------------------------------------------
  admin_test:
    container_name: admin_test
    profiles: ["test"]
    build:
      context: ./admin
      target: test
    depends_on:
      admin_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: ${ADMIN_APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: admin_db
      DB_PORT: 3306
      DB_DATABASE: ${ADMIN_DB_DATABASE}
      DB_USERNAME: ${ADMIN_DB_USERNAME}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /

  main_test:
    container_name: main_test
    profiles: ["test"]
    build:
      context: ./main
      target: test
    depends_on:
      main_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: ${MAIN_APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: main_db
      DB_PORT: 3306
      DB_DATABASE: ${MAIN_DB_DATABASE}
      DB_USERNAME: ${MAIN_DB_USERNAME}
      DB_PASSWORD: ${MAIN_DB_PASSWORD}
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /

volumes:
  admin_db_data:
  main_db_data:
