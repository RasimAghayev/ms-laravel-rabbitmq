worker_processes  auto;

# The master process runs as the non-root `www-data` user (set via the
# Dockerfile's USER directive) - there is no `user` directive here because
# nginx can only drop privileges from root to a named user, never change
# from one non-root user to another; running non-root from the start means
# there is nothing left to drop.
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    # Alpine's nginx package ships default temp-file paths under
    # /var/lib/nginx/tmp, owned by the `nginx` system user/group (not
    # `www-data`) - redirected under /tmp (world-writable) so the
    # non-root `www-data` process can create them itself on first use.
    client_body_temp_path  /tmp/nginx/client_temp;
    proxy_temp_path        /tmp/nginx/proxy_temp;
    fastcgi_temp_path      /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path         /tmp/nginx/uwsgi_temp;
    scgi_temp_path          /tmp/nginx/scgi_temp;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
