name: CI

# The whole quality gate runs inside the project's own Docker images (the
# same docker-compose.yaml used for local dev), so the runner needs a
# Docker daemon and nothing else. No PHP toolchain is installed on the
# runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pipeline only reads the repository. It never publishes anything and
# never writes to the GitHub API.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Docker quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the local environment file
        # CI-only values, generated fresh on every run - never committed,
        # never reused outside this job.
        run: |
          cp .env.example .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^ADMIN_DB_PASSWORD=.*/ADMIN_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^MAIN_DB_PASSWORD=.*/MAIN_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s#^ADMIN_APP_KEY=.*#ADMIN_APP_KEY=base64:$(openssl rand -base64 32)#" .env
          sed -i "s#^MAIN_APP_KEY=.*#MAIN_APP_KEY=base64:$(openssl rand -base64 32)#" .env

      - name: Validate the compose file
        run: docker compose config --quiet

      # `make verify` = build every service's image + run the Docker
      # standard's `test` stage for both apps (migrate, `artisan test`,
      # `composer audit`) via the `admin_test`/`main_test` profile
      # services - the same gate a local `make verify` runs, so CI and a
      # developer's machine can never silently disagree about what
      # "passing" means. Replaces the previous exec-into-a-dev-container
      # flow, which no longer applies now that `admin_app`/`main_app`/
      # `main_worker` run the built `runtime` image with no bind mount
      # (Phase 5, container baseline).
      - name: make verify (build + test stage, both apps)
        run: make verify

      # `make up` depends on `verify` and never runs otherwise (CLAUDE.md
      # standing decision 2) - starting the real runtime stack here proves
      # the images that just passed verify also boot, migrate cleanly, and
      # report healthy, not just that the test stage passed in isolation.
      - name: make up (runtime stack)
        run: make up

      - name: Wait for all three app containers to report healthy
        run: |
          for svc in admin_app main_app main_worker; do
            echo "waiting for $svc..."
            timeout 60 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $svc)\" = healthy ]; do sleep 2; done"
          done

      - name: Confirm runtime containers run as non-root
        run: |
          for svc in admin_app main_app main_worker; do
            user=$(docker compose exec -T "$svc" whoami)
            echo "$svc runs as: $user"
            [ "$user" = "www-data" ] || { echo "::error::$svc is not running as www-data"; exit 1; }
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
